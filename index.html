<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <div class="color-container">
       <div class="color-box">
             <div class="color-change">
                <input type="range" min="0" max="255" step="1">
            </div>
            <div class="item-color">
                <div>red: <span></span></div>
            </div>
       </div>
        </div>
             <div class="color-container">
       <div class="color-box">
             <div class="color-change">
                <input type="range" min="0" max="255" step="1">
            </div>
            <div class="item-color">
                <div>green: <span></span></div>
            </div>
       </div>
        </div>
             <div class="color-container">
       <div class="color-box">
             <div class="color-change">
                <input type="range" min="0" max="255" step="1">
            </div>
            <div class="item-color">
                <div>blue: <span></span></div>
            </div>
       </div>
        </div>
              <div class="color-container">
       <div class="color-box">
             <div class="color-change">
                <input type="range" min="0" max="1" step=".1">
            </div>
            <div class="item-color">
                <div>alfa: <span></span></div>
            </div>
       </div>
        </div>
    </section>
    <div class="rgba-box">rgba:(<span class="allcolor"></span>,<span class="allcolor"></span>,<span class="allcolor"></span>,<span class="allcolor"></span>)</div>
    <script src="color.js"></script>
</body>
</html>
